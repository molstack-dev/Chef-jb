<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tarjeta — Chef Jonathan Buitrago</title>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="../assets/style.css" rel="stylesheet">
<style>
/* ============================================================
   SAFETY OVERRIDES
   ============================================================ */
html, body {
    background: #1a1a1a;
    padding: 20px;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    min-height: 100vh;
    overflow-x: visible;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
}
a { color: inherit; text-decoration: none; font-style: normal; }
a:hover { font-style: normal; }

:root {
    --gold: #d6a34a;
    --gold-bright: #fbbf24;
    --gold-deep: #b45309;
    --purple-deep: #1a0a2e;
    --purple-mid: #581c87;
    --purple-glow: #7c3aed;
    --bg: #0a0512;
    --text: #f3e8ff;
    --muted: #c4b5fd;
    --line: rgba(214,163,74,0.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: 85mm 55mm; margin: 0; }

/* ============================================================
   TARJETA
   ============================================================ */
.tarjeta {
    width: 85mm;                                            /* ← ancho de la tarjeta (estándar 85mm) */
    height: 55mm;                                           /* ← alto de la tarjeta (estándar 55mm) */
    border-radius: 2mm;                                     /* ← redondeo de esquinas */
    position: relative;
    overflow: hidden;
    color: var(--text);
    box-shadow: 0 15px 40px rgba(88,28,135,0.6);
}
.tarjeta + .tarjeta { page-break-before: always; }

/* ============================================================
   CARA FRONTAL
   ============================================================ */
.tarjeta-frontal {
    background:
        radial-gradient(ellipse at top right, rgba(124,58,237,0.55) 0%, transparent 55%),
        radial-gradient(ellipse at bottom left, rgba(88,28,135,0.5) 0%, transparent 55%),
        linear-gradient(135deg, #0d0d1a 0%, #1a0a2e 50%, #0a0512 100%);
    display: flex;
    flex-direction: column;
    padding: 5mm;                                           /* ← padding interno (antes 6mm) */
    justify-content: space-between;
}
.tarjeta-frontal::before {
    content: '';
    position: absolute;
    inset: 2mm;                                             /* ← distancia del marco interior */
    border: 0.5px solid var(--line);
    border-radius: 1.5mm;
    pointer-events: none;
}

/* ============================================================
   FOTO EN LA CARA FRONTAL — esquina superior derecha
   Ajusta aquí tamaño, encuadre y zoom
   ============================================================ */
.tarjeta-foto {
    /* ---------- TAMAÑO DEL MARCO ---------- */
    width: 26mm;                                            /* ← ancho del marco · ej: 20mm, 26mm, 32mm */
    height: 26mm;                                           /* ← alto · igual al ancho para círculo */

    /* ---------- FORMA ---------- */
    border-radius: 50%;                                     /* ← 50% = círculo · 3mm = cuadrado redondeado */

    /* ---------- ENCUADRE ---------- */
    object-fit: cover;                                      /* ← cover recorta · contain completa */
    object-position: center top;                            /* ← encuadre: center · top · bottom · center 30% */

    /* ---------- ZOOM ---------- */
    transform: scale(1);                                    /* ← 1 normal · 1.2 = +20% · 0.9 = -10% */
    transform-origin: center;                               /* ← desde dónde crece el zoom */

    /* ---------- BORDE Y FONDO ---------- */
    border: 2px solid var(--gold);                          /* ← grosor del borde · ej: 1px, 2px, 3px */
    padding: 0.1mm;                                         /* ← espacio entre foto y borde */
    background: rgba(26,10,46,0.85);                        /* ← color de fondo detrás */
    overflow: hidden;                                       /* ← recorta lo que sobresale con zoom */

    /* ---------- POSICIÓN ---------- */
    position: absolute;                                     /* ← no cambiar (posición libre) */
    top: 14mm;                                               /* ← distancia desde arriba */
    right: 5mm;                                             /* ← distancia desde la derecha */
    z-index: 2;                                             /* ← por encima del marco decorativo */

    /* ---------- GLOW ---------- */
    box-shadow: 0 0 12px rgba(251,191,36,0.5),
                0 0 6px rgba(124,58,237,0.6);
}

/* ============================================================
   LOGO / MARCA SUPERIOR
   ============================================================ */
.tarjeta-marca {
    display: flex;
    align-items: center;
    gap: 1.8mm;
    position: relative;
    z-index: 1;
}
.tarjeta-marca svg {
    width: 4.5mm;
    height: 4.5mm;
    color: var(--gold-bright);
    filter: drop-shadow(0 0 4px rgba(251,191,36,0.6));
}
.tarjeta-marca-texto {
    font-family: 'Playfair Display', serif;
    font-size: 5.5pt;
    color: var(--gold);
    letter-spacing: 2.5px;
    text-transform: uppercase;
    font-weight: 500;
}

/* ============================================================
   NOMBRE — usa .parisienne-font de style.css
   ============================================================ */
.tarjeta-nombre {
    font-size: 20pt;                                        /* ← tamaño del nombre (antes 24pt) */
    color: var(--gold-bright);
    line-height: 0.9;
    text-shadow: 0 0 12px rgba(251,191,36,0.55),
                 0 1.5px 6px rgba(214,163,74,0.4);
    position: relative;
    z-index: 1;
}

.tarjeta-nombre-linea {
    width: 18mm;                                            /* ← ancho de la línea dorada */
    height: 0.5px;
    background: linear-gradient(90deg, var(--gold), transparent);
    margin: 1.5mm 0;
    position: relative;
    z-index: 1;
}

.tarjeta-rol {
    font-family: 'Playfair Display', serif;
    font-size: 6pt;
    color: var(--text);
    letter-spacing: 1.6px;
    text-transform: uppercase;
    font-weight: 400;
    position: relative;
    z-index: 1;
}

/* ============================================================
   FOOTER FRONTAL
   ============================================================ */
.tarjeta-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1;
}
.tarjeta-logros-mini { display: flex; gap: 1mm; }
.tarjeta-logros-mini svg {
    width: 2.8mm;
    height: 2.8mm;
    color: var(--gold);
    filter: drop-shadow(0 0 3px rgba(251,191,36,0.6));
}
.tarjeta-web {
    font-size: 5pt;
    color: var(--gold-bright);
    font-weight: 600;
    letter-spacing: 0.5px;
    text-shadow: 0 0 8px rgba(124,58,237,0.8);
}

/* ============================================================
   CARA TRASERA
   ============================================================ */
.tarjeta-trasera {
    background:
        radial-gradient(ellipse at top left, rgba(124,58,237,0.3) 0%, transparent 55%),
        linear-gradient(135deg, #0d0d1a 0%, #1a0a2e 100%);
    padding: 5mm;                                           /* ← padding interno */
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 3.5mm;
    align-items: center;
    position: relative;
}
.tarjeta-trasera::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 1mm;
    height: auto;                                             /* ← barra dorada lateral */
    background: linear-gradient(180deg, var(--purple-glow), var(--gold-bright), var(--purple-glow));
}

.tarjeta-trasera-info {
    display: flex;
    flex-direction: column;
    gap: 1.8mm;
    position: relative;
    z-index: 1;
}
.tarjeta-trasera-titulo {
    font-family: 'Playfair Display', serif;
    font-size: 7.5pt;
    color: var(--gold-bright);
    font-weight: 700;
    letter-spacing: 0.3px;
    margin-bottom: 0.8mm;
    text-shadow: 0 0 8px rgba(124,58,237,0.7);
}
.tarjeta-trasera-titulo::after {
    content: '';
    display: block;
    width: 7mm;                                             /* ← ancho de la línea bajo el título */
    height: 0.7px;
    background: var(--gold);
    margin-top: 0.8mm;
}

.tarjeta-dato {
    display: flex;
    align-items: center;
    gap: 1.6mm;
    font-size: 5.8pt;
    color: var(--text);
    line-height: 1.3;
    margin-top: 2px;
    margin-bottom: 2px;
}
.tarjeta-dato svg {
    width: 2.6mm;
    height: 2.6mm;
    flex-shrink: 0;
    color: var(--gold-bright);
}

/* ============================================================
   QR TRASERO — ajusta aquí tamaño, encuadre y zoom
   ============================================================ */
.tarjeta-qr {
    /* ---------- TAMAÑO ---------- */
    width: 24mm;                                            /* ← ancho del QR · ej: 12mm, 16mm, 20mm */
    height: 24mm;                                           /* ← alto · igual al ancho */

    /* ---------- FORMA Y BORDE ---------- */
    background: #fff;                                       /* ← fondo blanco */
    padding: 0.6mm;                                         /* ← espacio entre QR y borde */
    border-radius: 1mm;                                     /* ← redondeo de esquinas */
    border: 1px solid var(--gold);                          /* ← grosor del borde dorado */

    /* ---------- ZOOM (opcional) ---------- */
    transform: scale(1);                                    /* ← 1 normal · 1.1 +10% · 0.9 -10% */

    /* ---------- GLOW ---------- */
    box-shadow: 0 0 10px rgba(124,58,237,0.6);

    position: relative;
    z-index: 1;
}
.tarjeta-qr img { width: 100%; height: 100%; display: block; }

.tarjeta-qr-label {
    position: absolute;
    bottom: -3.5mm;                                         /* ← distancia de la etiqueta debajo del QR */
    left: 50%;
    transform: translateX(-50%);
    font-size: 4.5pt;
    color: var(--muted);
    text-align: center;
    white-space: nowrap;
    letter-spacing: 0.3px;
}

/* ============================================================
   PRINT
   ============================================================ */
@media print {
    html, body { background: #fff; padding: 0; gap: 0; min-height: auto; display: block; }
    .tarjeta { box-shadow: none; border-radius: 0; }
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     CARA FRONTAL
     ═══════════════════════════════════════════════════════════ -->
<div class="tarjeta tarjeta-frontal">

    <!-- ⬇️ FOTO DEL CHEF — esquina superior derecha -->
    <img src="../img/chef.jpg" alt="Chef Jonathan Buitrago" class="tarjeta-foto">

    <div class="tarjeta-marca">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>

    <div>
        <h1 class="parisienne-font tarjeta-nombre">Jonathan<br>Buitrago</h1>
        <div class="tarjeta-nombre-linea"></div>
        <p class="tarjeta-rol">Pastelero &amp; Chocolatero</p>
    </div>

    <div class="tarjeta-footer">
        <div class="tarjeta-logros-mini">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </div>
        <span class="tarjeta-web">chef-jb.freedev.app</span>
    </div>
</div>

     ═══════════════════════════════════════════════════════════ -->

    </div>

    <!-- ⬇️ QR TRASERO — ajustar en .tarjeta-qr -->
    <div style="position: relative;">
        <div class="tarjeta-qr">
            <img src="img/qr_pagina.svg" alt="QR">
        </div>
        <span class="tarjeta-qr-label">Escanea</span>

</div>

</body>
</html>
